<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>MANDO · Puntero</title>
  <link rel="stylesheet" href="puntero.css">
</head>
<body>
  <header>
    <strong>MANDO · Puntero</strong>
    <span id="estado" class="estado">Sin conectar</span>
  </header>

  <section id="inicio">
    <p>Apuntá el teléfono a la pantalla como si fuera un control remoto.</p>
    <button id="activar" class="grande">Activar puntero</button>
    <p id="aviso" class="aviso" hidden></p>
  </section>

  <section id="control" hidden>
    <div id="pad" class="pad">
      <span id="padTexto">Tocá acá = clic<br><small>Arrastrar el dedo también mueve</small></span>
    </div>
    <div class="fila">
      <button id="derecho">Clic derecho</button>
      <button id="centrar">Centrar</button>
    </div>
    <label class="opcion"><input type="checkbox" id="mantener"> Mover solo con el dedo apoyado</label>
    <label class="opcion">Velocidad <input type="range" id="ganancia" min="8" max="90" value="32"></label>
    <div class="fila">
      <label class="opcion chica"><input type="checkbox" id="invX"> Invertir ←→</label>
      <label class="opcion chica"><input type="checkbox" id="invY"> Invertir ↑↓</label>
    </div>
    <button id="cortar" class="peligro">Desconectar</button>
  </section>

  <script src="puntero.js"></script>
</body>
</html>
