<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MANDO · Proyector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="./tema.css" />
  <link rel="stylesheet" href="./tv.css" />
  <link rel="stylesheet" href="./proyector.css" />
</head>
<body class="pro">
  <main class="pro__escena">
    <div class="pro__tv-caja">
      <div id="tv" class="pro__tv"></div>
      <button type="button" class="pro__activar" id="activar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span><strong>Activar sonido y pantalla completa</strong>Tocá una vez antes de empezar</span>
      </button>
    </div>
    <aside class="pro__lado">
      <header class="pro__cabeza">
        <p class="pro__marca">MANDO</p>
        <h1 class="pro__titulo">Controlá esta TV con tu celular</h1>
      </header>
      <section class="pro__unirse" id="unirse" hidden>
        <p class="pro__qr-hint">Escaneá con el celular</p>
        <img
          id="qr"
          class="pro__qr"
          alt="Código QR para abrir el mando en el celular"
          width="240"
          height="240"
          hidden
        />
        <p class="pro__etiqueta">o entrá desde el celular a</p>
        <p class="pro__url" id="url"></p>
        <p class="pro__etiqueta">y poné el código</p>
        <p class="pro__codigo" id="codigo"></p>
      </section>
      <section class="pro__conectados" aria-label="Aparatos conectados">
        <h2 class="pro__seccion">Conectados</h2>
        <ul class="pro__conectores" id="conectores">
          <li data-ok="true"><strong>TV simulada</strong></li>
        </ul>
      </section>
    </aside>
  </main>
  <p class="pro__aviso" id="aviso" role="status" aria-live="polite"></p>
  <script type="module" src="./proyector.js"></script>
</body>
</html>
