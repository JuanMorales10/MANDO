<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101522" />
  <title>MANDO · Tu control</title>
  <link rel="stylesheet" href="./identidad.css" />
  <link rel="stylesheet" href="./remote.css" />
  <link rel="stylesheet" href="./celular.css" />
</head>
<body class="cel">
  <header class="cel__barra">
    <span class="cel__marca">MANDO</span>
    <span class="cel__conexion" id="conexion" data-estado="off">Sin conectar</span>
  </header>

  <form class="cel__entrar" id="entrar" autocomplete="off">
    <h1>Conectá tu mando</h1>
    <p>Escribí el código que aparece en el proyector.</p>
    <input id="codigo" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" aria-label="Código de 4 dígitos" required />
    <button type="submit">Conectar</button>
    <p class="cel__error" id="error-entrar" role="alert"></p>
  </form>

  <main class="cel__mando" id="mando" hidden>
    <p class="cel__estado" id="estado" role="status" aria-live="polite"></p>
    <div id="remote"></div>
    <section class="cel__extra" aria-label="Más controles">
      <button type="button" data-accion="POWER"><span aria-hidden="true">⏻</span> Encendido</button>
      <button type="button" data-accion="CH_DOWN"><span aria-hidden="true">◀</span> Canal −</button>
      <button type="button" data-accion="CH_UP">Canal + <span aria-hidden="true">▶</span></button>
    </section>
    <p class="cel__error" id="error-mando" role="alert"></p>
  </main>

  <script type="module" src="./celular.js"></script>
</body>
</html>
